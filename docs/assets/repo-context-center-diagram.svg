<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Repo Context Center workflow</title>
  <desc id="desc">Repo Context Center builds repository understanding, task routing, startup context, work tracking, and agent handover.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101828"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12V2Z" fill="#7DD3FC"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="72" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="800">
    Repo Context Center
  </text>
  <text x="600" y="112" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19">
    Repository memory for task starts, work tracking, and agent handover
  </text>

  <g filter="url(#shadow)">
    <rect x="220" y="165" width="760" height="340" rx="24" fill="#111827" stroke="#334155"/>
  </g>

  <g>
    <rect x="380" y="205" width="440" height="58" rx="12" fill="#172033" stroke="#38BDF8" stroke-opacity="0.7"/>
    <text x="600" y="240" text-anchor="middle" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800">Repository Understanding</text>

    <line x1="600" y1="263" x2="600" y2="292" stroke="#7DD3FC" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="380" y="300" width="440" height="58" rx="12" fill="#172033" stroke="#38BDF8" stroke-opacity="0.7"/>
    <text x="600" y="335" text-anchor="middle" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800">Task Routing</text>

    <line x1="600" y1="358" x2="600" y2="387" stroke="#7DD3FC" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="380" y="395" width="440" height="58" rx="12" fill="#172033" stroke="#38BDF8" stroke-opacity="0.7"/>
    <text x="600" y="430" text-anchor="middle" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800">Startup Context</text>
  </g>

  <line x1="820" y1="424" x2="890" y2="424" stroke="#7DD3FC" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="910" y="340" width="210" height="168" rx="18" fill="url(#accent)"/>
  </g>
  <text x="1015" y="382" text-anchor="middle" fill="#052E16" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="900">Work Tracking</text>
  <text x="1015" y="418" text-anchor="middle" fill="#052E16" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700">rcc done</text>
  <line x1="1015" y1="438" x2="1015" y2="463" stroke="#064E3B" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1015" y="488" text-anchor="middle" fill="#052E16" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="900">Agent Handover</text>

  <g>
    <rect x="80" y="260" width="210" height="128" rx="18" fill="#0F172A" stroke="#475569"/>
    <text x="185" y="300" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800">Agent Task</text>
    <text x="185" y="334" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">rcc work</text>
    <text x="185" y="362" text-anchor="middle" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">task, files, tests</text>
  </g>

  <line x1="290" y1="324" x2="360" y2="324" stroke="#7DD3FC" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="275" y="545" width="650" height="44" rx="12" fill="#020617" stroke="#334155"/>
  <text x="600" y="573" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">
    rcc work "&lt;task&gt;" --agent  |  rcc done --summary "..."  |  rcc handoff
  </text>
</svg>
