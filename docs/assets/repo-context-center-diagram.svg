<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Repo Context Center workflow comparison</title>
  <desc id="desc">A comparison between an AI agent without Repo Context Center scanning many files and an AI agent with Repo Context Center using AGENTS.md and ai-context files to open relevant files faster.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10V2Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowAccent" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10V2Z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>

  <circle cx="1080" cy="80" r="160" fill="#38BDF8" opacity="0.08"/>
  <circle cx="120" cy="560" r="170" fill="#A78BFA" opacity="0.08"/>

  <text x="600" y="66" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="800">
    Repo Context Center
  </text>
  <text x="600" y="104" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19">
    Give AI coding agents a lightweight map before they scan the whole repository
  </text>

  <!-- Left card -->
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="500" height="395" rx="28" fill="#1E293B" stroke="#334155"/>
  </g>
  <text x="320" y="198" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800">
    Without RCC
  </text>
  <text x="320" y="226" text-anchor="middle" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
    Agent reorients itself every session
  </text>

  <!-- Left agent -->
  <rect x="115" y="270" width="120" height="70" rx="18" fill="#0F172A" stroke="#475569"/>
  <circle cx="150" cy="296" r="10" fill="#94A3B8"/>
  <circle cx="198" cy="296" r="10" fill="#94A3B8"/>
  <path d="M150 318C164 330 185 330 199 318" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <text x="175" y="371" text-anchor="middle" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">AI agent</text>

  <line x1="245" y1="305" x2="340" y2="305" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- File cloud -->
  <g>
    <rect x="360" y="247" width="145" height="34" rx="8" fill="#334155"/>
    <rect x="380" y="291" width="145" height="34" rx="8" fill="#334155"/>
    <rect x="350" y="335" width="145" height="34" rx="8" fill="#334155"/>
    <rect x="405" y="379" width="105" height="34" rx="8" fill="#334155"/>
    <text x="433" y="270" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">src/*</text>
    <text x="452" y="314" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">tests/*</text>
    <text x="423" y="358" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">generated/*</text>
    <text x="458" y="402" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">docs/*</text>
  </g>

  <text x="320" y="465" text-anchor="middle" fill="#FCA5A5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">
    Broad scan → repeated discovery → wasted context
  </text>
  <text x="320" y="495" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
    Entry points, tests, risks, and noisy paths are rediscovered again
  </text>

  <!-- Right card -->
  <g filter="url(#shadow)">
    <rect x="630" y="150" width="500" height="395" rx="28" fill="#162033" stroke="#2563EB" stroke-opacity="0.55"/>
  </g>
  <text x="880" y="198" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800">
    With RCC
  </text>
  <text x="880" y="226" text-anchor="middle" fill="#BAE6FD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
    Agent starts from durable repository context
  </text>

  <!-- Right flow -->
  <rect x="675" y="270" width="105" height="70" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.65"/>
  <circle cx="706" cy="296" r="9" fill="#38BDF8"/>
  <circle cx="748" cy="296" r="9" fill="#38BDF8"/>
  <path d="M707 318C719 328 736 328 748 318" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <text x="728" y="371" text-anchor="middle" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">AI agent</text>

  <line x1="792" y1="305" x2="850" y2="305" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowAccent)"/>

  <rect x="865" y="244" width="185" height="122" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.75"/>
  <text x="957" y="274" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800">Context Center</text>
  <text x="957" y="302" text-anchor="middle" fill="#BAE6FD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">AGENTS.md</text>
  <text x="957" y="325" text-anchor="middle" fill="#BAE6FD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">TASK_ROUTING.md</text>
  <text x="957" y="348" text-anchor="middle" fill="#BAE6FD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">TOKEN_BUDGET.md</text>

  <line x1="957" y1="380" x2="957" y2="420" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowAccent)"/>

  <rect x="824" y="430" width="266" height="58" rx="16" fill="url(#accent)" opacity="0.95"/>
  <text x="957" y="454" text-anchor="middle" fill="#020617" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="900">Open relevant files first</text>
  <text x="957" y="477" text-anchor="middle" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700">Less scanning • Less noise • Faster start</text>

  <text x="880" y="518" text-anchor="middle" fill="#86EFAC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800">
    Route first → read less → solve faster
  </text>

  <!-- Bottom command -->
  <rect x="300" y="570" width="600" height="42" rx="14" fill="#020617" stroke="#334155"/>
  <text x="600" y="597" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">
    npx repo-context-center init &amp;&amp; npx repo-context-center map --write
  </text>
</svg>
