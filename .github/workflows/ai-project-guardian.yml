name: AI Project Guardian

on:
  pull_request:
  push:
    branches:
      - main
      - "test/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ai-project-guardian
        uses: actions/checkout@v4
        with:
          repository: cyberturk01/ai-project-guardian
          path: .guardian

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .guardian/package-lock.json

      - name: Install Guardian dependencies
        working-directory: .guardian
        run: npm ci

      - name: Build Guardian
        working-directory: .guardian
        run: npm run build

      - name: Prepare git base
        run: |
          git fetch origin main --depth=2 || true
          git rev-parse HEAD
          git rev-parse origin/main || true
          git rev-parse HEAD~1 || true

      - name: Run Guardian summary
        run: |
          node .guardian/dist/src/cli/index.js \
            --repo . \
            --base origin/main \
            --out guardian-summary.md \
            --summary-only

      - name: Append report to job summary
        if: always()
        run: |
          if [ -f guardian-summary.md ]; then
            cat guardian-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Guardian summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate full Guardian report
        if: always()
        run: |
          node .guardian/dist/src/cli/index.js \
            --repo . \
            --base origin/main \
            --out guardian-report.md \
            --full-report

      - name: Upload full Guardian report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-project-guardian-report
          path: guardian-report.md
